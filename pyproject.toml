[project]
name = "youtube-translator"
version = "0.1.1"
description = "youtube translator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
             "quickmt",
             "spacy",
             "pysbd",
             "en-core-web-trf",
             "debugpy>=1.8.17",
             "aiofiles",
             "pyperclip",
             "yt-dlp",
             "numpy<2.0.0"
]

[tool.uv.sources]
en-core-web-trf = { path = "en_core_web_trf-3.7.3-py3-none-any.whl" }
quickmt = { path = "./quickmt", editable = true }
